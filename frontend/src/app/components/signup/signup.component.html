<div class="signup-container">
    <h2>Signup</h2>
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name <em class="required">*</em></label>
        <input id="name" formControlName="name" type="text" placeholder="Enter your name" />
        <div class="error" *ngIf="signupForm.get('name')?.touched && signupForm.get('name')?.invalid">
          Name is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="email">Email <em class="required">*</em></label>
        <input id="email" formControlName="email" type="email" placeholder="Enter your email" />
        <div class="error" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          <span *ngIf="signupForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="signupForm.get('email')?.errors?.['email']">Invalid email format.</span>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password <em class="required">*</em></label>
        <input id="password" formControlName="password" type="password" placeholder="Enter your password" />
        <div class="error" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          <span *ngIf="signupForm.get('password')?.errors?.['required']">Password is required.</span>
          <span *ngIf="signupForm.get('password')?.errors?.['minlength']">
            Password must be at least 6 characters long.
          </span>
        </div>
      </div>
  
      <button type="submit" [disabled]="signupForm.invalid">Signup</button>
      <p>Already have an account? <a routerLink="/login" routerLinkActive="active-link" class="text-blue" (click)="navigateToLogin()">Login</a></p>
    </form>
  </div>
