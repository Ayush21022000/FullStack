<div class="login-container">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email <em class="required">*</em></label>
        <input id="email" formControlName="email" type="email" placeholder="Enter your email" />
        <div class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format.</span>
        </div>
      </div>
  
      <div class="form-group">
        <label for="password">Password <em class="required">*</em></label>
        <input id="password" formControlName="password" type="password" placeholder="Enter your password" />
        <div class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>
  
      <button type="submit" [disabled]="loginForm.invalid">Login</button>
      <p>Don't have an account? <a routerLink="/signup" routerLinkActive="active-link" class="text-blue" (click)="navigateToSignup()">Signup</a></p>
    </form>
  </div>
